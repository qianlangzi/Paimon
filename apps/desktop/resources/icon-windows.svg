<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Windows variant of the Paimon tile. This file is also the source of the tray
     bitmap (`pnpm run render:tray-icon`), which enlarges the `tray-glyph` group
     and keeps the tile behind it. `tile` and `artwork` are the two groups the
     icon renderers address by id. -->
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFFFFF"/>
<stop offset="1" stop-color="#EDEFF5"/>
</linearGradient>
<linearGradient id="mark" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
<stop stop-color="#14161B"/>
<stop offset="1" stop-color="#262932"/>
</linearGradient>
<mask id="counter" maskUnits="userSpaceOnUse" x="0" y="0" width="284" height="520">
<rect width="284" height="520" fill="#fff"/>
<ellipse cx="142" cy="142" rx="56" ry="68" fill="#000"/>
</mask>
</defs>
<g transform="translate(32 32) scale(0.9375) translate(-40 -32)">
<g id="tile">
<rect rx="192" x="40" y="32" width="1024" height="1024" fill="url(#plate)"/>
<rect rx="192" x="40.5" y="32.5" width="1023" height="1023" fill="none" stroke="#E3E6EE"/>
</g>
<g id="artwork">
<g id="tray-glyph">
<g transform="translate(353.3 194.5) scale(1.2212)">
<ellipse cx="142" cy="142" rx="118" ry="142" fill="url(#mark)" mask="url(#counter)"/>
<rect width="84" height="520" rx="10" fill="url(#mark)"/>
</g>
</g>
</g>
</g>
</svg>
